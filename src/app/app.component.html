<div class="app-shell">
  <a class="skip-link" href="#content">{{ 'a11y.skip' | translate }}</a>
  <app-navbar></app-navbar>
  <main id="content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
  <footer class="footer">
    <div class="container footer__content">
      <app-logo size="sm" />
      <span>&copy; {{ currentYear }} {{ 'footer.copy' | translate }}</span>
      <div class="footer__links">
        <a
          href="https://github.com/fjbatresv"
          target="_blank"
          rel="noopener noreferrer"
          (click)="track('contact_github')"
          >{{ 'footer.links.github' | translate }}</a
        >
        <a
          href="https://www.linkedin.com/in/fjbatresv"
          target="_blank"
          rel="noopener noreferrer"
          (click)="track('contact_linkedin')"
          >{{ 'footer.links.linkedin' | translate }}</a
        >
        <a [href]="emailLink" (click)="track('contact_email')">{{
          'footer.links.email' | translate
        }}</a>
      </div>
    </div>
  </footer>
</div>
