<section id="contact" aria-labelledby="contact-title">
  <div class="container contact">
    <div>
      <p class="tagline">{{ 'contact.tagline' | translate }}</p>
      <h2 id="contact-title">{{ 'contact.title' | translate }}</h2>
    </div>
    <div class="contact__actions">
      <a class="contact__primary" [href]="emailLink" (click)="track('contact_email')"
        >{{ 'contact.email' | translate }} <span aria-hidden="true">↗</span></a
      >
      <a
        href="https://www.linkedin.com/in/fjbatresv"
        target="_blank"
        rel="noopener"
        (click)="track('contact_linkedin')"
        >LinkedIn ↗</a
      >
      <a
        href="https://calendar.notion.so/meet/javierbatres/7v3284yxr"
        target="_blank"
        rel="noopener"
        (click)="track('contact_calendar')"
        >{{ 'contact.calendar' | translate }} ↗</a
      >
    </div>
    <a
      class="contact__github"
      href="https://github.com/fjbatresv"
      target="_blank"
      rel="noopener"
      (click)="track('contact_github')"
      >GitHub ↗</a
    >
  </div>
</section>
