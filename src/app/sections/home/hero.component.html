<section id="top" class="hero">
  <div class="container hero__grid">
    <div class="hero__content">
      <p class="tagline">{{ 'hero.status' | translate }}</p>
      <h1>
        {{ 'hero.title' | translate }}
        <span class="accent">{{ 'hero.titleAccent' | translate }}</span>
      </h1>
      <p class="hero__role">{{ 'hero.role' | translate }}</p>
      <p class="lead">{{ 'hero.summary' | translate }}</p>
      <div class="hero__actions">
        <a class="button" href="#how-i-work" (click)="track('cta_project')"
          >{{ 'hero.cta.project' | translate }} <span aria-hidden="true">→</span></a
        >
        <a class="button alt" href="#experience" (click)="track('cta_hire')"
          >{{ 'hero.cta.hire' | translate }} <span aria-hidden="true">→</span></a
        >
      </div>
    </div>
    <img
      class="hero__photo"
      src="/assets/face.webp"
      width="300"
      height="300"
      alt="Javier Batres"
      fetchpriority="high"
    />
  </div>
</section>
