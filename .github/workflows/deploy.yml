name: Build and Deploy to S3

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Optimize images (lossless)
        run: |
          if compgen -G "src/assets/**/*.svg" > /dev/null; then
            npx svgo -q -f src/assets --config=svgo.config.cjs
          else
            echo "No SVG assets found, skipping svgo."
          fi

      - name: Inject environment (Sentry)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: false,
            sentryDsn: '${SENTRY_DSN}'
          };
          EOF
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            sentryDsn: '${SENTRY_DSN}'
          };
          EOF
          npx prettier --write "src/environments/*.ts"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watch=false

      - name: Build (production, optimized)
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::605134457500:role/fjbatresv-web-gha-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sentry upload sourcemaps & release
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          RELEASE: ${{ github.sha }}
        run: |
          npx @sentry/cli releases new "$RELEASE"
          npx @sentry/cli sourcemaps upload --release="$RELEASE" dist/javier-batres-site/browser --url-prefix="~/"
          npx @sentry/cli releases finalize "$RELEASE"

      - name: Remove sourcemaps before deploy
        run: find dist/javier-batres-site -name "*.map" -type f -delete

      - name: Sync to S3
        run: |
          # esbuild emits an eight-character hash between each built asset's final hyphen and extension.
          aws s3 sync dist/javier-batres-site/browser/ s3://${{ secrets.S3_BUCKET }}/ --delete --exclude "*" --include "*-????????.*" --exclude "*.html" --exclude "index.csr.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/javier-batres-site/browser/ s3://${{ secrets.S3_BUCKET }}/ --delete --exclude "*" --include "*" --exclude "*-????????.*" --exclude "*.html" --exclude "index.csr.html" --cache-control "public, max-age=3600"
          aws s3 sync dist/javier-batres-site/browser/ s3://${{ secrets.S3_BUCKET }}/ --delete --exclude "*" --include "*.html" --exclude "index.csr.html" --cache-control "no-cache" --content-type "text/html"
          aws s3 cp dist/javier-batres-site/browser/robots.txt s3://${{ secrets.S3_BUCKET }}/robots.txt --cache-control "public, max-age=3600" --content-type "text/plain"
          aws s3 cp dist/javier-batres-site/browser/sitemap.xml s3://${{ secrets.S3_BUCKET }}/sitemap.xml --cache-control "public, max-age=3600" --content-type "application/xml"

      - name: Output artifact size
        run: du -sh dist/javier-batres-site

      - name: Invalidate CloudFront
        if: ${{ env.DISTRIBUTION_ID != '' }}
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
